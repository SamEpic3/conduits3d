<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9a77a"/><stop offset=".5" stop-color="#c8805a"/><stop offset="1" stop-color="#8f4f2e"/>
    </linearGradient>
    <linearGradient id="fo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a5f66"/><stop offset="1" stop-color="#22252a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#1f2327"/>
