  <path d="M120 400 V250 a110 110 0 0 1 110 -110 H400" fill="none" stroke="url(#cu)" stroke-width="64" stroke-linecap="butt"/>
  <!-- raccords (bourrelets) -->
  <rect x="78" y="372" width="84" height="56" rx="10" fill="url(#fo)"/>
  <rect x="372" y="98" width="56" height="84" rx="10" fill="url(#fo)"/>
  <!-- filets -->
