<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2327">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conduits 3D">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Conduits 3D – montages de tuyaux, tubes et raccords</title>
<style>
:root{
  --bg:#eef0f2; --panel:#ffffff; --fg:#1d2126; --muted:#5f6872; --line:#d5dade;
  --stage:#e6e9ec; --copper:#b8692f; --copper-strong:#9a5523; --copper-soft:#f6e6d8;
  --blue:#1f56c4; --warn:#9a5b00;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16191c; --panel:#1f2327; --fg:#e8ebee; --muted:#9aa3ac; --line:#323940;
  --stage:#c9ced3; --copper:#d98a4e; --copper-strong:#e9a06a; --copper-soft:#3a2a1f; --blue:#7fa8ec; --warn:#e3a54a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;padding:16px}
.stage{background:var(--stage);border-radius:12px;overflow:hidden;position:relative;height:100%}
#cv{display:block;width:100%;height:100%;touch-action:none}
.stage.outil-mesure #cv{cursor:crosshair}
#etiquettes{position:absolute;inset:0;pointer-events:none;z-index:2}
#etiquettes .etq{position:absolute;transform:translate(-50%,-130%);white-space:nowrap;font:600 13px var(--mono);color:#fff;background:var(--blue);padding:2px 7px;border-radius:6px;box-shadow:0 1px 4px rgb(0 0 0 / .25)}
#etiquettes .etq.apercu{background:#e0560b}
.panel{position:absolute;top:12px;right:12px;bottom:12px;width:min(310px,calc(100% - 24px));z-index:5;padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto;
  background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 22px rgb(0 0 0 / .12)}
.entete{display:flex;align-items:center;gap:8px}
.entete h1{flex:1}
.replier{display:none;padding:6px 12px;font-size:18px;line-height:1}
.contenu{display:flex;flex-direction:column;gap:12px}
button,select,input{touch-action:manipulation}
.panel section{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
h1{font:600 22px var(--display);margin:0;letter-spacing:.2px}
h2{font:600 18px var(--display);margin:0}
h3{font:600 13px var(--body);margin:0;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
select,input[type=text]{font:500 15px var(--body);padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:100%}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
button{font:600 14px/1 var(--body);border-radius:8px;padding:9px 10px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg);white-space:nowrap}
button:hover:not(:disabled){border-color:var(--copper)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--copper);border-color:var(--copper);color:#fff}
button.primary:hover:not(:disabled){background:var(--copper-strong)}
button.danger{color:#b3261e}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:4px 0 0}
dt{color:var(--muted)} dd{margin:0;font-family:var(--mono);font-size:13px;align-self:center}
.muted{color:var(--muted);margin:0;font-size:13.5px}
.badge{font:600 11px var(--mono);background:var(--copper-soft);color:var(--copper-strong);border-radius:999px;padding:2px 8px;justify-self:start;align-self:flex-start}
ol.coudes{margin:2px 0 0;padding-left:20px;font:500 12.5px var(--mono)}
#listeMesures{margin:0;padding-left:18px;font:500 13px var(--mono)}
#listeMesures:empty{display:none}
.toolbar{position:absolute;top:10px;left:10px;display:flex;gap:4px;padding:4px;border-radius:10px;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px rgb(0 0 0 / .08);z-index:4;flex-wrap:wrap;max-width:calc(100% - 350px)}
.toolbar button{padding:7px 9px;border:0;background:transparent;font-size:14px}
.toolbar button:hover:not(:disabled){background:var(--bg)}
.toolbar button.on{background:var(--copper);color:#fff}
.toolbar .sep{width:1px;align-self:stretch;background:var(--line);margin:4px 2px}
#modes{top:58px}
#note{position:absolute;left:50%;bottom:14px;transform:translateX(calc(-50% - 160px));z-index:4;max-width:min(560px,calc(100% - 360px));padding:9px 14px;border-radius:10px;margin:0;
  background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);font-size:14px;text-align:center;box-shadow:0 2px 8px rgb(0 0 0 / .08)}
#note.erreur{border-color:var(--warn);color:var(--warn)}
#chargement{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
/* --- Téléphone : plein écran ; outils en haut --- */
@media (max-width:760px) and (orientation:portrait), (max-height:520px) and (orientation:landscape){
  body{padding:0}
  .stage{border-radius:0;height:100dvh}
  .toolbar{top:calc(env(safe-area-inset-top) + 6px);left:calc(env(safe-area-inset-left) + 6px);right:6px;max-width:none;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:2px}
  .toolbar::-webkit-scrollbar{display:none}
  .toolbar .txt{display:none}
  .toolbar button{padding:8px 9px;font-size:16px;min-width:38px;flex:none}
  .toolbar [data-vue]{font-size:13px;padding:8px 6px}
  .toolbar .sep{flex:none}
  #modes{top:calc(env(safe-area-inset-top) + 56px);right:auto}
  .replier{display:inline-block}
  .panel.replie .contenu{display:none}
  .panel.replie .replier{transform:rotate(180deg)}
  h1{font-size:19px}
  button{padding:10px 10px;min-height:40px}
  select,input[type=text]{font-size:16px}
  #note{font-size:13px;padding:7px 10px;transform:none;max-width:none}
}
/* Portrait : le panneau est un tiroir au bas de l'écran. */
@media (max-width:760px) and (orientation:portrait){
  .panel{top:auto;left:0;right:0;bottom:0;width:100%;max-height:52dvh;border-radius:14px 14px 0 0;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:8px;box-shadow:0 -4px 18px rgb(0 0 0 / .15)}
  #note{left:8px;right:8px;top:auto;bottom:calc(var(--hauteur-panneau, 60px) + 8px)}
}
/* Paysage : le panneau est à droite, sur toute la hauteur. */
@media (max-height:520px) and (orientation:landscape){
  .panel{top:6px;right:calc(env(safe-area-inset-right) + 6px);bottom:6px;width:270px;padding:8px 10px;gap:8px}
  .panel.replie{bottom:auto}
  .toolbar{right:290px}
  #note{left:8px;right:290px;top:auto;bottom:8px}
}
/* iOS 27 floute le haut des PWA installées : une bande opaque de 11 px tout en haut (avec la barre d'état « default »)
   l'en empêche. Seulement en mode app installée ; le contenu est décalé d'autant. */
#bandeIos{display:none}
@media (display-mode: standalone){
  #bandeIos{display:block;position:fixed;top:0;left:0;right:0;height:11px;background:var(--bg);z-index:1000;pointer-events:none}
  body{padding-top:27px}
}
@media (display-mode: standalone) and (max-width:760px) and (orientation:portrait),
       (display-mode: standalone) and (max-height:520px) and (orientation:landscape){
  #bandeIos{background:var(--stage)}
  body{padding-top:11px}
  .stage{height:100%}
}
</style>
<!--IMPORTMAP-->
</head>
<body>
<div id="bandeIos" aria-hidden="true"></div>
<div class="stage" id="stage">
  <canvas id="cv" aria-label="Vue 3D du montage"></canvas>
  <div id="etiquettes"></div>
  <p id="chargement">Chargement de la 3D…</p>

  <div class="toolbar" role="toolbar" aria-label="Outils">
    <button data-outil="main" class="on" title="Sélection (S) : choisis une sortie ou une pièce"><span class="ic">✋</span><span class="txt"> Sélection</span></button>
    <button data-outil="mesure" title="Mesure (M) : clique deux points repères"><span class="ic">📏</span><span class="txt"> Mesure</span></button>
    <span class="sep"></span>
    <button id="btnAnnuler" title="Annuler (Ctrl+Z)" disabled><span class="ic">↶</span><span class="txt"> Annuler</span></button>
    <button id="btnCoupe" title="Vue en coupe"><span class="ic">◧</span><span class="txt"> Coupe</span></button>
    <span class="sep"></span>
    <button data-vue="iso" title="Vue 3D">3D</button>
    <button data-vue="face" title="Vue de face">Face</button>
    <button data-vue="dessus" title="Vue de dessus">Dessus</button>
    <button data-vue="cote" title="Vue de côté">Côté</button>
  </div>
  <div class="toolbar" id="modes" role="radiogroup" aria-label="Type de mesure" hidden>
    <button data-mode="d" class="on" title="Distance réelle entre les deux points">⤢ Directe</button>
    <button data-mode="x" title="Écart selon X (largeur)">↔ X</button>
    <button data-mode="y" title="Écart selon Y (hauteur)">↕ Y</button>
    <button data-mode="z" title="Écart selon Z (profondeur)">⊙ Z</button>
  </div>
  <p id="note">Choisis une pièce, puis clique « Ajouter » pour commencer le montage.</p>

  <aside class="panel">
    <div class="entete">
      <h1>Conduits 3D</h1>
      <button id="btnPanneau" class="replier" aria-expanded="true" aria-controls="contenuPanneau" title="Replier ou ouvrir le panneau">▾</button>
    </div>
    <div class="contenu" id="contenuPanneau">

    <section>
      <h3>Ajouter une pièce</h3>
      <label>Pièce
        <select id="selPiece">
          <optgroup label="Acier NPT (fonte malléable noire)">
            <option value="mamelon">Mamelon / tuyau</option>
            <option value="manchon">Manchon</option>
            <option value="coude90">Coude 90°</option>
            <option value="coude45">Coude 45°</option>
            <option value="te">Té</option>
            <option value="union">Union</option>
            <option value="reducteur">Réducteur hexagonal (mâle × femelle)</option>
            <option value="bouchon">Bouchon à tête carrée</option>
            <option value="capuchon">Capuchon</option>
          </optgroup>
          <optgroup label="Cuivre à souder">
            <option value="cu-tube">Tube de cuivre</option>
            <option value="cu-manchon">Manchon</option>
            <option value="cu-coude90">Coude 90°</option>
            <option value="cu-coude45">Coude 45°</option>
            <option value="cu-te">Té</option>
            <option value="cu-union">Union</option>
            <option value="cu-capuchon">Capuchon</option>
            <option value="cu-adaptM">Adaptateur cuivre × NPT mâle</option>
            <option value="cu-adaptF">Adaptateur cuivre × NPT femelle</option>
          </optgroup>
          <optgroup label="Raccords de tube (laiton)">
            <option value="tb-tube">Tube de cuivre recuit</option>
            <option value="tb-sae-m">Connecteur SAE 45° × NPT mâle</option>
            <option value="tb-sae-f">Connecteur SAE 45° × NPT femelle</option>
            <option value="tb-if-m">Connecteur inverted flare × NPT mâle</option>
            <option value="tb-if-f">Connecteur inverted flare × NPT femelle</option>
            <option value="tb-comp-m">Connecteur compression × NPT mâle</option>
            <option value="tb-comp-f">Connecteur compression × NPT femelle</option>
          </optgroup>
        </select>
      </label>
      <div class="row">
        <label><span id="lblTailleTexte">Diamètre nominal</span>
          <select id="selTaille"><option>1/2</option><option>3/4</option></select>
        </label>
        <label id="lblTailleB" hidden><span id="lblTailleBTexte">Filet NPT</span>
          <select id="selTailleB"><option>1/2</option><option>3/4</option></select>
        </label>
        <label id="lblLongueur">Longueur (po)
          <input type="text" id="txtLongueur" list="longueursStd" value="3" inputmode="decimal">
          <datalist id="longueursStd"></datalist>
        </label>
      </div>
      <button id="btnAjouter" class="primary">＋ Ajouter</button>
      <button id="btnImporter" title="Poser un tube cintré exporté par la cintreuse 3D (fichier .json)">⤓ Importer un tube cintré</button>
      <input type="file" id="fichierTube" accept=".json,application/json" hidden>
      <button id="btnFermer" title="Relier deux sorties face à face avec le tuyau ou le tube de la bonne longueur">⟲ Fermer une boucle</button>
      <p class="muted" id="indice"></p>
    </section>

    <section id="secPiece" hidden>
      <h3>Pièce choisie</h3>
      <div id="fiche"></div>
      <div class="row">
        <button data-tourner="-90" title="Tourner autour du joint">↺ 90°</button>
        <button data-tourner="-45">↺ 45°</button>
        <button data-tourner="45">↻ 45°</button>
        <button data-tourner="90">↻ 90°</button>
      </div>
      <div class="row">
        <label class="check" style="flex:1.4">Tourner de <input type="text" id="txtAngle" value="5" inputmode="decimal" style="width:64px"> °</label>
        <button id="btnTournerDe">Tourner</button>
      </div>
      <div class="row">
        <button id="btnSortie" title="Brancher la pièce par une autre de ses sorties">⇄ Changer de sortie</button>
        <button id="btnSupprimer" class="danger" title="Supprimer (Suppr) : enlève aussi ce qui est branché dessus">🗑 Supprimer</button>
      </div>
    </section>

    <section>
      <h3>Mesures</h3>
      <ol id="listeMesures"></ol>
      <p class="muted" id="mesVide">Outil Mesure : clique deux points repères (centre d'un raccord en violet, face ou bout de tuyau en gris).</p>
      <div class="row">
        <button id="btnEffMesures" disabled>Effacer les mesures</button>
        <button id="btnToutEffacer" class="danger">Nouveau montage</button>
      </div>
    </section>
    </div>
  </aside>
</div>
<script type="module">
import 'app/main.js';
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
