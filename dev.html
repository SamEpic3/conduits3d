<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conduits 3D – montages de tuyaux, tubes et raccords</title>
<style>
:root{
  --bg:#eef0f2; --panel:#ffffff; --fg:#1d2126; --muted:#5f6872; --line:#d5dade;
  --stage:#e6e9ec; --copper:#b8692f; --copper-strong:#9a5523; --copper-soft:#f6e6d8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16191c; --panel:#1f2327; --fg:#e8ebee; --muted:#9aa3ac; --line:#323940;
  --stage:#c9ced3; --copper:#d98a4e; --copper-strong:#e9a06a; --copper-soft:#3a2a1f; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;padding:16px}
.stage{background:var(--stage);border-radius:12px;overflow:hidden;position:relative;height:100%}
#cv{display:block;width:100%;height:100%;touch-action:none}
.panel{position:absolute;top:12px;right:12px;width:min(300px,calc(100% - 24px));z-index:5;padding:14px;display:grid;gap:12px;
  background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 22px rgb(0 0 0 / .12)}
h1{font:600 22px var(--display);margin:0;letter-spacing:.2px}
h2{font:600 19px var(--display);margin:0}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
select{font:500 15px var(--body);padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;align-items:center}
.check{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--fg)}
button{font:600 14px/1 var(--body);border-radius:8px;padding:9px 12px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
button:hover{border-color:var(--copper)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0}
dt{color:var(--muted)} dd{margin:0;font-family:var(--mono);font-size:13.5px;align-self:center}
.muted{color:var(--muted);margin:2px 0 0} .petit{font-size:12.5px}
#fiche{border-top:1px solid var(--line);padding-top:10px}
#chargement{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.badge{font:600 11px var(--mono);background:var(--copper-soft);color:var(--copper-strong);border-radius:999px;padding:2px 8px;justify-self:start}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/controls/OrbitControls.js":"./vendor/addons/OrbitControls.js","three/addons/environments/RoomEnvironment.js":"./vendor/addons/RoomEnvironment.js","app/":"./src/"}}</script>
</head>
<body>
<div class="stage">
  <canvas id="cv" aria-label="Vue 3D de la pièce"></canvas>
  <p id="chargement">Chargement de la 3D…</p>
  <aside class="panel">
    <h1>Conduits 3D</h1>
    <span class="badge">Étape 1 · visionneuse de pièces</span>
    <label>Pièce
      <select id="selPiece">
        <optgroup label="Acier NPT (fonte malléable noire)">
          <option value="manchon">Manchon</option>
          <option value="coude90">Coude 90°</option>
          <option value="coude45">Coude 45°</option>
          <option value="te">Té</option>
          <option value="union">Union</option>
          <option value="mamelon">Mamelon</option>
        </optgroup>
      </select>
    </label>
    <label>Diamètre nominal
      <select id="selTaille"><option>1/2</option><option>3/4</option></select>
    </label>
    <label id="lblLongueur" hidden>Longueur du mamelon
      <select id="selLongueur"></select>
    </label>
    <div class="row">
      <label class="check"><input type="checkbox" id="chkCoupe"> Vue en coupe</label>
      <button id="btnCadrer" style="margin-left:auto">Recentrer</button>
    </div>
    <div id="fiche"></div>
  </aside>
</div>
<script type="module">
import 'app/main.js';
</script>
</body>
</html>
